<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PostIt</title>
  <link rel="stylesheet" href="postit.css">
</head>
<body>
  <main>
    <h1>PostIt</h1>

    <!-- input name-->
    <section id="nameBox">
      <p>Enter your name:</p>
      <input type="text" id="nameInput" placeholder="Full name">
      <button id="nameBtn">Save name</button>
    </section>

    <!-- Posting area -->
    <section id="postBox" hidden>
      <p>Hi, <strong id="userName"></strong></p>
      <textarea id="caption" rows="3" placeholder="Write a caption..."></textarea>
      <button id="postBtn">Post</button>
    </section>

    <section id="thread"></section>
  </main>

  <script src="postit.js"></script>
</body>
</html>
